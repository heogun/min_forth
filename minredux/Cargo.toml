[package]
name = "minredux"
version = "0.1.0"
edition = "2024"
description = "Microcode-driven Minimal 64x4 Revision 1.4 (Redux) emulator"

[lib]
name = "minredux"
path = "src/lib.rs"

[[bin]]
name = "minredux"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
