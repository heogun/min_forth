[package]
name = "minredux-gui"
version = "0.1.0"
edition = "2024"
description = "Windowed monochrome frontend for the Minimal 64x4 Redux emulator"
publish = false

[[bin]]
name = "minredux-gui"
path = "src/main.rs"

[dependencies]
minifb = "0.29"
minredux = { path = ".." }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
